name: macOS Intel package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/Cellar/dav1d
            /usr/local/Cellar/ffmpeg
            /usr/local/Cellar/lame
            /usr/local/Cellar/libvmaf
            /usr/local/Cellar/libvpx
            /usr/local/Cellar/mpg123
            /usr/local/Cellar/openssl@4
            /usr/local/Cellar/opus
            /usr/local/Cellar/sdl2-compat
            /usr/local/Cellar/sdl3
            /usr/local/Cellar/svt-av1
            /usr/local/Cellar/x264
            /usr/local/Cellar/x265
            /usr/local/Cellar/xz
          key: intel-media-v1-${{ hashFiles('distribution/compliance/macos-sources.json') }}-${{ github.run_id }}
          restore-keys: |
            intel-media-v1-${{ hashFiles('distribution/compliance/macos-sources.json') }}-
      - name: Reuse installed Intel build tools
        run: python scripts/prepare_macos_intel_media.py --tools
      - name: Install pinned media foundation
        run: python scripts/prepare_macos_intel_media.py openssl@4 xz mpg123 lame dav1d libvmaf
      - name: Build pinned libvpx
        run: python scripts/prepare_macos_intel_media.py libvpx
      - name: Build pinned opus
        run: python scripts/prepare_macos_intel_media.py opus
      - name: Build pinned sdl3
        run: python scripts/prepare_macos_intel_media.py sdl3
      - name: Build pinned sdl2-compat
        run: python scripts/prepare_macos_intel_media.py sdl2-compat
      - name: Build pinned svt-av1
        run: python scripts/prepare_macos_intel_media.py svt-av1
      - name: Build pinned x264
        run: python scripts/prepare_macos_intel_media.py x264
      - name: Build pinned x265
        run: python scripts/prepare_macos_intel_media.py x265
      - name: Build pinned FFmpeg
        run: python scripts/prepare_macos_intel_media.py ffmpeg
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: macos-intel-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            macos-intel-${{ hashFiles('Cargo.lock') }}-
      - name: Check format, lint and native tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --locked -- -D warnings
          cargo test --workspace --locked
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build release workspace
        run: cargo build --workspace --release --locked
      - name: Package and verify Intel DMG
        run: |
          python scripts/package_macos.py
          python scripts/verify_distributed_tools.py --helpers target/macos-package/easycat.app/Contents/Helpers --libraries target/macos-package/easycat.app/Contents/Frameworks --output target/macos-verification/codecs
          python scripts/verify_macos_package.py
          git archive --format=tar.gz --prefix=easycat-0.1.0-preview.6-intel/ --output=dist/easycat-0.1.0-preview.6-intel-source.tar.gz HEAD
      - name: Preserve media build logs
        if: always()
        run: |
          mkdir -p target/macos-verification/homebrew-logs
          if test -d "$HOME/Library/Logs/Homebrew"; then
            cp -R "$HOME/Library/Logs/Homebrew/." target/macos-verification/homebrew-logs/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easycat-macos-intel
          path: |
            dist/*
            target/macos-verification
            target/macos-package/easycat.app/Contents/Resources/build-info.json
            target/macos-package/easycat.app/Contents/Resources/dependency-manifest.json
            target/macos-package/easycat.app/Contents/Resources/Licenses/*/formula/*.rb
            target/macos-package/easycat.app/Contents/Resources/Licenses/*/INSTALL_RECEIPT.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: macos-intel-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            /usr/local/Cellar/dav1d
            /usr/local/Cellar/ffmpeg
            /usr/local/Cellar/lame
            /usr/local/Cellar/libvmaf
            /usr/local/Cellar/libvpx
            /usr/local/Cellar/mpg123
            /usr/local/Cellar/openssl@4
            /usr/local/Cellar/opus
            /usr/local/Cellar/sdl2-compat
            /usr/local/Cellar/sdl3
            /usr/local/Cellar/svt-av1
            /usr/local/Cellar/x264
            /usr/local/Cellar/x265
            /usr/local/Cellar/xz
          key: intel-media-v1-${{ hashFiles('distribution/compliance/macos-sources.json') }}-${{ github.run_id }}
