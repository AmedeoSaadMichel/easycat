name: Native distribution verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            archive: easycat-0.1.0-linux-x86_64.tar.gz
            sha256: c622fa35edff134c57b08f1f10c4edb598131ebdea25cd879d205d49ca5f4ead
          - os: windows-2022
            platform: windows
            archive: easycat-0.1.0-windows-x64.zip
            sha256: aed0e92984ae15198f060473c46dc742d59aa999762082b6ba4fafd0a47190be
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native Windows compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-python
      - name: Native Linux FFmpeg source build
        if: runner.os == 'Linux'
        run: python scripts/rebuild_ffmpeg_core.py
      - name: Native Windows FFmpeg source build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/rebuild_ffmpeg_core.py
      - name: Download original distributed package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ matrix.archive }}
        run: gh release download v0.1.0-preview.1 --pattern "$env:PACKAGE_NAME" --dir target/archives
        if: runner.os == 'Windows'
      - name: Download original Linux package
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ matrix.archive }}
        run: gh release download v0.1.0-preview.1 --pattern "$PACKAGE_NAME" --dir target/archives
      - name: Verify and unpack the actual release
        env:
          PACKAGE_NAME: ${{ matrix.archive }}
          PACKAGE_SHA256: ${{ matrix.sha256 }}
        shell: python
        run: |
          import hashlib, os, pathlib, tarfile, zipfile
          archive = pathlib.Path('target/archives') / os.environ['PACKAGE_NAME']
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['PACKAGE_SHA256']
          output = pathlib.Path('target/native-package')
          output.mkdir()
          if archive.suffix == '.zip':
              with zipfile.ZipFile(archive) as source:
                  source.extractall(output)
          else:
              with tarfile.open(archive) as source:
                  source.extractall(output, filter='data')
      - name: Verify actual bundled codecs and tools
        shell: python
        run: |
          import pathlib, subprocess, sys
          package = next(pathlib.Path('target/native-package').iterdir())
          subprocess.run([sys.executable, 'scripts/verify_distributed_tools.py',
              '--helpers', str(package / 'Helpers'), '--libraries', str(package / 'lib'),
              '--output', 'target/native-package-tests'], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-verification-${{ matrix.platform }}
          path: |
            target/source-build-check/result.json
            target/source-build-check/build.log
            target/native-package-tests/*.json
            target/native-package-tests/*.txt
          retention-days: 30
          if-no-files-found: error
